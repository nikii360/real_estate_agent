<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Start Real Estate AI Call</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      max-width: 500px;
      margin: auto;
      background: #f4f4f4;
    }
    input, button {
      display: block;
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .status {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Initiate AI Real Estate Call</h2>

  <form id="callForm">
    <input type="text" id="fullName" placeholder="Full Name" required />
    <input type="email" id="email" placeholder="Email Address" required />
    <input type="tel" id="contactNumber" placeholder="Contact Number (e.g. +919123456789)" required />
    <button type="submit">Start Call</button>
    <div class="status" id="status"></div>
  </form>

  <script>
    document.getElementById('callForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const contactNumber = document.getElementById('contactNumber').value;

      const payload = {
        agent_id: "606kCnF7n0yQevgo8Nte",
        agent_phone_number_id: "ZAErUDT6eQgMjNgiabmK",
        to_number: contactNumber,
        conversation_initiation_client_data: {
          dynamic_variables: {
            user_name: fullName,
            available_time: new Date().toISOString(),
            user_available: true,
            email_address: email
          }
        }
      };

      const statusEl = document.getElementById('status');
      statusEl.textContent = "Calling...";

      try {
        const response = await fetch('https://real-estate-agent-5wth.onrender.com/start-call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusEl.textContent = "✅ Call initiated successfully!";
        } else {
          console.error(result);
          statusEl.textContent = "❌ Failed to start call.";
        }
      } catch (error) {
        console.error('Fetch error:', error);
        statusEl.textContent = "⚠️ Error connecting to server.";
      }
    });
  </script>

</body>
</html>
